# 定期的に、配信中の県の地図を最新の OSM データで作り直し、最新のリリースの該当ファイルだけを差し替える。
# 対象は index.json に載っている県だけ。全国の広域図・住所データ・施設データは変更しない。
name: build-maps

on:
  schedule:
    - cron: "0 18 * * *"   # 毎日 03:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "作って確認するだけ（アップロードしない）"
        type: boolean
        default: false
      prefs:
        description: "作る県を絞る（例: 21,23）。空なら配信中の県すべて"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install osmium shapely mapbox_earcut numpy pillow
      - name: update maps
        run: python tools/update_release.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.prefs && format('--prefs {0}', inputs.prefs) || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
      # GitHub は更新のないリポジトリの定期実行を 60 日で止めるので、毎回有効にし直す
      - name: keep schedule alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/maps.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
